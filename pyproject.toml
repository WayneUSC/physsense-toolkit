[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "physsense"
version = "0.1.0"
authors = [{name = "WayneUSC"}]
description = "Offline and synthetic tactile and radar signal-processing building blocks"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy>=1.24,<3"]

[project.optional-dependencies]
rerun = ["rerun-sdk==0.23.2"]
dev = ["pytest>=8,<9", "build>=1,<2"]

[project.scripts]
physsense = "physsense.cli:main"

[tool.setuptools.packages.find]
include = ["physsense*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
